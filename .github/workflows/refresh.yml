name: Refresh pre-flight data

on:
  schedule:
    - cron: '*/10 * * * *'   # GitHub may delay scheduled runs at busy times
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch sources -> data.json
        env:
          NWS_CONTACT: ${{ vars.NWS_CONTACT }}
        # Source failures are recorded inside data.json; only a broken script fails this step.
        run: node scripts/fetch.mjs

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html app.js suncalc.js config.json data.json _site/
          cp -r samples _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
